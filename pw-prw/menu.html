<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PW / PRW - Water Record</title>
  <link rel="stylesheet" href="../css/style.css?v=5.0">
  <script>
    (function(){ var t=localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme',t); })();
    function toggleTheme(){ var c=document.documentElement.getAttribute('data-theme'); var n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('theme',n); var b=document.getElementById('themeToggle'); if(b) b.innerHTML=n==='dark'?'☀️':'🌙'; }
    function initThemeBtn(){ var t=localStorage.getItem('theme')||'light'; var b=document.getElementById('themeToggle'); if(b) b.innerHTML=t==='dark'?'☀️':'🌙'; }
    document.addEventListener('DOMContentLoaded', initThemeBtn);
  </script>
  <style>
  /* ── Submenu card grid ── */
  .submenu-container { max-width: 680px; margin: 0 auto; padding-top: var(--space-10); }
  .submenu-header { text-align: center; margin-bottom: var(--space-8); }
  .submenu-header__title { font-family: var(--font-display); font-size: 2rem; font-weight: 400; color: var(--ink); margin-bottom: var(--space-2); letter-spacing: -0.02em; }
  .submenu-header__desc { color: var(--ink-muted); font-size: 0.95rem; }

  .menu-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2rem;
  }
  .card-grid-space { display: flex; flex-direction: column; }
  .card-grid-space .num {
    font-size: 1.5rem; font-weight: 700;
    color: var(--line-strong); margin-bottom: 0.6rem; margin-left: 0.4rem;
    font-family: var(--font-mono); letter-spacing: -0.04em;
    transition: color 0.3s;
  }
  .card-grid-space:hover .num { color: var(--primary); }

  .menu-card {
    --bg-filter-opacity: 0.5;
    height: 14em;
    font-size: 1rem;
    color: white;
    border-radius: var(--radius-xl);
    padding: 1.4em;
    display: flex;
    align-items: flex-end;
    background-size: cover;
    background-position: center;
    box-shadow: var(--shadow-lg);
    transition: all 0.45s cubic-bezier(0.16,1,0.3,1);
    position: relative;
    overflow: hidden;
    text-decoration: none;
    border: 3px solid rgba(255,255,255,0.15);
  }
  .menu-card::before, .menu-card::after {
    content: '';
    transform: scale(0);
    transform-origin: top left;
    border-radius: 50%;
    position: absolute;
    left: -50%; top: -50%;
    z-index: 0;
    transition: all 0.45s cubic-bezier(0.16,1,0.3,1);
  }
  .menu-card::before { background: rgba(255,255,255,0.12); width: 250%; height: 250%; }
  .menu-card::after  { background: rgba(220,242,235,0.97); width: 200%; height: 200%; }
  [data-theme="dark"] .menu-card::after { background: rgba(7,18,14,0.97); }

  .menu-card:hover { border-color: var(--primary); }
  .menu-card:hover::before, .menu-card:hover::after { transform: scale(1); }

  .menu-card > div { position: relative; z-index: 1; width: 100%; }

  .menu-card__title {
    font-size: 1.15rem; font-weight: 600; margin: 0 0 0.25em;
    transition: color 0.45s; color: white;
  }
  .menu-card:hover .menu-card__title { color: #2a5546; }
  [data-theme="dark"] .menu-card:hover .menu-card__title { color: #70B8A2; }

  .menu-card__desc {
    font-size: 0.75rem; margin: 0; opacity: 0.85; line-height: 1.5;
    transition: color 0.45s, opacity 0.45s; color: white;
  }
  .menu-card:hover .menu-card__desc { color: #3a6858; opacity: 1; }
  [data-theme="dark"] .menu-card:hover .menu-card__desc { color: #9acfbc; }

  /* menu cards — same teal family, lighter than index */
  .menu-card--list  { background-image: linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)), linear-gradient(145deg, #40826D 0%, #70B8A2 100%); }
  .menu-card--print { background-image: linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)), linear-gradient(145deg, #356b58 0%, #62a891 100%); }

  @keyframes menuCardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-grid-space { animation: menuCardIn 0.4s cubic-bezier(0.16,1,0.3,1) both; }
  .card-grid-space:nth-child(1) { animation-delay: 0ms; }
  .card-grid-space:nth-child(2) { animation-delay: 80ms; }
</style>
  <link rel="stylesheet" href="../css/anf3-v7.css">
</head>
<body data-workflow="water">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-header__logo">
          <div class="app-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
          </div>
          <div>
            <div class="app-header__title">PW / PRW</div>
            <div class="app-header__subtitle">Water Record</div>
          </div>
        </div>
        
        <nav class="app-header__nav">
          <a href="../index.html" class="nav-btn" title="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
          </a>
          <a href="../master-data.html?type=water" class="nav-btn" title="Water Sampling Points">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
            <span>Water Point</span>
          </a>
          <a href="../master-data.html?type=air" class="nav-btn" title="Air Sampling Points">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            <span>Air Point</span>
          </a>
          <a href="../doc_code.html" class="nav-btn" title="Doc Code Guide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span>Doc Code</span>
          </a>
          <div class="app-header__user">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span id="usernameDisplay">-</span>
          </div>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="submenu-container animate-slide-up">
        <div class="submenu-header">
          <h1 class="submenu-header__title">PW / PRW Form</h1>
          <p class="submenu-header__desc">เลือกการดำเนินการที่ต้องการ</p>
        </div>

        <div class="menu-cards">
          <div class="card-grid-space">
            <div class="num">01</div>
            <a href="list.html" class="menu-card menu-card--list">
              <div>
                <div class="menu-card__title">รายการ Worksheet</div>
                <div class="menu-card__desc">ค้นหา เลือก และจัดการรายการที่บันทึกไว้</div>
              </div>
            </a>
          </div>
          <div class="card-grid-space">
            <div class="num">02</div>
            <a href="print.html" class="menu-card menu-card--print">
              <div>
                <div class="menu-card__title">พิมพ์รายงาน</div>
                <div class="menu-card__desc">เลือก Worksheet และสร้าง PDF รายงาน</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      Water Record System v1.0 • ANF3 Laboratory
    </footer>
  </div>

<button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Dark / Light mode">🌙</button>

  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const username = Storage.get('username');
      if (!username) {
        window.location.href = '../index.html';
        return;
      }
      document.getElementById('usernameDisplay').textContent = username;
    });
  </script>
</body>
</html>
