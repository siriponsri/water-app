<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พิมพ์รายงาน Compressed Air - Air Record</title>
  <link rel="stylesheet" href="../css/style.css?v=5.0">
  <script>
    (function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    .print-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      min-height: calc(100vh - 80px);
    }
    .print-sidebar {
      position: sticky; top: 16px; max-height: calc(100vh - 96px); overflow-y: auto;
      background: var(--paper-elevated); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: var(--space-4);
      display: flex; flex-direction: column; gap: var(--space-3); align-self: start;
    }
    .print-sidebar__title {
      font-size: 0.68rem; font-weight: 700; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      padding-bottom: var(--space-3); border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .sidebar-controls { display: flex; gap: var(--space-2); align-items: center; flex-shrink: 0; }
    .sidebar-controls select {
      flex: 1; font-size: 0.78rem; padding: var(--space-1) var(--space-2);
      border: 1px solid var(--line); border-radius: var(--radius-md);
      background: var(--paper); color: var(--ink);
    }
    .sidebar-search { position: relative; flex-shrink: 0; }
    .sidebar-search input {
      width: 100%; box-sizing: border-box;
      padding: var(--space-2) var(--space-2) var(--space-2) 2rem;
      font-size: 0.78rem; border: 1px solid var(--line);
      border-radius: var(--radius-md); background: var(--paper); color: var(--ink);
    }
    .sidebar-search svg {
      position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%);
      width: 13px; height: 13px; color: var(--ink-muted); pointer-events: none;
    }
    .refresh-btn {
      background: transparent; border: 1px solid var(--line); cursor: pointer;
      color: var(--water); padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-md); display: flex; align-items: center;
      flex-shrink: 0; transition: background 0.15s;
    }
    .refresh-btn:hover { background: var(--water-soft); }
    .refresh-btn svg { width: 14px; height: 14px; }
    .worksheet-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2);
    }
    .worksheet-item {
      padding: var(--space-3); background: var(--paper);
      border: 1px solid var(--line); border-left: 2px solid transparent;
      border-radius: var(--radius-md); cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .worksheet-item:hover, .worksheet-item.active {
      border-color: var(--water); background: var(--water-soft);
      border-left-color: var(--primary); transform: translateX(2px);
    }
    .worksheet-item__docno { font-weight: 600; font-size: 0.82rem; font-family: var(--font-mono); color: var(--ink); }
    .worksheet-item__meta { font-size: 0.68rem; color: var(--ink-muted); margin-top: 2px; }

    .print-main { display: flex; flex-direction: column; gap: var(--space-3); }

    .print-actions {
      display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4);
      background: var(--paper-elevated); border: 1px solid var(--line);
      border-radius: var(--radius-lg); align-items: center; flex-wrap: wrap; flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    [data-theme="dark"] .print-actions { background: rgba(8,15,29,0.9); border-color: rgba(255,255,255,0.08); }
    .print-actions__info { flex: 1; min-width: 120px; }
    .print-actions__ws { font-size: 0.85rem; font-weight: 600; font-family: var(--font-mono); color: var(--ink); }
    .print-actions__sub { font-size: 0.68rem; color: var(--ink-muted); }
    .print-actions .btn {
      background: var(--ink); color: white; border: 1px solid var(--ink);
      padding: var(--space-2) var(--space-3); font-size: 0.78rem;
      border-radius: var(--radius-md); display: inline-flex; align-items: center;
      gap: var(--space-2); cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
    }
    .print-actions .btn:hover:not(:disabled) { opacity: 0.8; }
    .print-actions .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .print-actions .btn:active { transform: scaleY(0.96) scaleX(0.98); }
    .print-actions .btn svg { width: 14px; height: 14px; }

    .override-panel {
      background: var(--paper-elevated); border: 1px solid var(--line);
      border-radius: var(--radius-lg); overflow: hidden; flex-shrink: 0;
    }
    .override-panel__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-4); cursor: pointer; user-select: none;
      background: var(--paper-warm); border-bottom: 1px solid var(--line);
    }
    .override-panel__title { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
    .override-panel__chevron { color: var(--ink-muted); display: flex; transition: transform 0.2s; }
    .override-panel__chevron svg { width: 16px; height: 16px; }
    .override-panel--collapsed .override-panel__chevron { transform: rotate(-90deg); }
    .override-panel__body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
    .override-panel--collapsed .override-panel__body { display: none; }

    .ov-row { display: grid; gap: var(--space-3); }
    .ov-row--4 { grid-template-columns: repeat(4, 1fr); }
    .ov-row--3 { grid-template-columns: repeat(3, 1fr); }
    .ov-group label {
      display: block; font-size: 0.62rem; font-weight: 700; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px;
    }
    .ov-group input {
      width: 100%; box-sizing: border-box; padding: var(--space-2) var(--space-3);
      font-size: 0.8rem; border: 1px solid var(--line); border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--water, #2196f3) 7%, var(--paper));
      color: var(--ink); transition: border-color 0.15s, box-shadow 0.15s;
    }
    .ov-group input:focus {
      outline: none; border-color: var(--water); box-shadow: 0 0 0 3px var(--water-soft);
    }

    .pdf-viewer {
      display: flex; flex-direction: column; background: var(--paper-elevated);
      border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden;
    }
    .pdf-viewer__header {
      padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
      background: var(--paper-warm); flex-shrink: 0;
    }
    .pdf-viewer__title { font-weight: 600; font-size: 0.82rem; color: var(--ink); }
    .pdf-viewer__content {
      display: flex; justify-content: center; align-items: flex-start;
      padding: var(--space-4); background: var(--paper);
    }
    .pdf-viewer__content.preview-pdf-mode { padding: 0; }
    .pdf-viewer__content.preview-pdf-mode iframe { display: block; width: 100%; min-height: 1123px; border: none; }
    .pdf-viewer__placeholder { text-align: center; color: var(--ink-muted); padding: 3rem 2rem; }
    .pdf-viewer__placeholder svg { width: 56px; height: 56px; margin-bottom: var(--space-3); color: var(--line-strong); }

    .pdf-fullscreen-overlay {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: #1a1a1a; flex-direction: column;
    }
    .pdf-fullscreen-overlay.active { display: flex; }
    .pdf-fullscreen-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #111; color: #eee; font-size: 0.8rem; flex-shrink: 0;
    }
    .pdf-fullscreen-bar button {
      background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .pdf-fullscreen-bar button:hover { background: rgba(255,255,255,0.25); }
    #fullscreenIframe { flex: 1; width: 100%; border: none; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .print-sidebar { animation: fadeSlideIn 0.4s cubic-bezier(0.16,1,0.3,1) both; }
    .print-main { animation: fadeSlideIn 0.4s 0.1s cubic-bezier(0.16,1,0.3,1) both; }

    @media (max-width: 900px) {
      .print-layout { grid-template-columns: 1fr; height: auto; }
      .print-sidebar { max-height: 240px; }
      .ov-row--4 { grid-template-columns: repeat(2, 1fr); }
      .ov-row--3 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
  <link rel="stylesheet" href="../css/anf3-v7.css">
</head>
<body data-workflow="air">
  <div class="app-container">
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-header__logo">
          <div class="app-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
            </svg>
          </div>
          <div>
            <div class="app-header__title">พิมพ์รายงาน</div>
            <div class="app-header__subtitle">Compressed Air Report</div>
          </div>
        </div>
        <nav class="app-header__nav">
          <a href="menu.html" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
            <span>Back</span>
          </a>
          <a href="../master-data.html?type=water" class="nav-btn" title="Water Sampling Points">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
            <span>Water Point</span>
          </a>
          <a href="../master-data.html?type=air" class="nav-btn" title="Air Sampling Points">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
            </svg>
            <span>Air Point</span>
          </a>
          <div class="app-header__user">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span id="usernameDisplay">-</span>
          </div>
        </nav>
      </div>
    </header>

    <main class="main-content" style="padding: var(--space-3) var(--space-4) 0">
      <div class="print-layout">

        <!-- LEFT SIDEBAR -->
        <div class="print-sidebar">
          <div class="print-sidebar__title">Worksheet Browser</div>

          <div class="sidebar-controls">
            <select id="statusFilter" onchange="onStatusFilterChange()">
              <option value="Routine">Routine</option>
              <option value="Other">Other</option>
            </select>
            <button class="refresh-btn" onclick="loadWorksheets()" title="รีเฟรช">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
            </button>
          </div>

          <div class="sidebar-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="worksheetSearch" type="text" placeholder="ค้นหา docNo / อาคาร / วันที่" oninput="filterWorksheetList()">
          </div>

          <div id="worksheetList" class="worksheet-list">
            <div style="text-align:center;color:var(--ink-muted);padding:var(--space-4);">กำลังโหลด...</div>
          </div>

          <button class="btn btn--secondary" onclick="clearCache()" style="width:100%;font-size:0.72rem;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Clear Cache
          </button>
        </div>

        <!-- MAIN AREA -->
        <div class="print-main">

          <!-- Action Bar -->
          <div class="print-actions">
            <div class="print-actions__info">
              <div class="print-actions__ws" id="selectedInfo">เลือก Worksheet</div>
              <div class="print-actions__sub" id="selectedSubInfo">&nbsp;</div>
            </div>
            <span id="pdfStatus" class="status-badge status-badge--offline">รอเลือก</span>
            <button id="btnPreview" class="btn" onclick="previewData()" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
              </svg>
              Preview Data
            </button>
            <button id="btnPreviewPdf" class="btn" onclick="previewPdfWithOverride()" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              Preview PDF
            </button>
            <button id="btnPrintPdf" class="btn" onclick="printPdfWithOverride()" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 6 2 18 2 18 9"/>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>
              </svg>
              Print PDF
            </button>
          </div>

          <!-- Override Panel -->
          <div class="override-panel" id="overridePanel">
            <div class="override-panel__header" onclick="toggleOverridePanel()">
              <span class="override-panel__title">📋 ข้อมูลเพิ่มเติม (สำหรับพิมพ์เท่านั้น)</span>
              <span class="override-panel__chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </span>
            </div>
            <div class="override-panel__body">

              <!-- Row 1: tempRoom, incNo, lotMedia, mfgMedia -->
              <div class="ov-row ov-row--4">
                <div class="ov-group">
                  <label>Temp Room (°C)</label>
                  <input type="number" id="ov_tempRoom" step="0.1" placeholder="25.5">
                </div>
                <div class="ov-group">
                  <label>Incubator No.</label>
                  <input type="text" id="ov_incNo" placeholder="INC-001">
                </div>
                <div class="ov-group">
                  <label>Lot Media</label>
                  <input type="text" id="ov_lotMedia">
                </div>
                <div class="ov-group">
                  <label>Mfg Media</label>
                  <input type="text" id="ov_mfgMedia">
                </div>
              </div>

              <!-- Row 2: expMedia, lotTSA, lotOther, placeholder -->
              <div class="ov-row ov-row--4">
                <div class="ov-group">
                  <label>Exp Media</label>
                  <input type="text" id="ov_expMedia">
                </div>
                <div class="ov-group">
                  <label>Lot TSA</label>
                  <input type="text" id="ov_lotTSA">
                </div>
                <div class="ov-group">
                  <label>Lot Other</label>
                  <input type="text" id="ov_lotOther">
                </div>
                <div class="ov-group"><!-- placeholder --></div>
              </div>

              <!-- Row 3: dates -->
              <div class="ov-row ov-row--3">
                <div class="ov-group">
                  <label>Determined Date</label>
                  <input type="date" id="ov_determinedDate">
                </div>
                <div class="ov-group">
                  <label>Concluded Date</label>
                  <input type="date" id="ov_concludedDate">
                </div>
                <div class="ov-group">
                  <label>Approved Date</label>
                  <input type="date" id="ov_approvedDate">
                </div>
              </div>

              <!-- Results Override (collapsible) -->
              <div style="margin-top:var(--space-4);border-top:1px solid var(--line);padding-top:var(--space-3);">
                <button type="button" onclick="toggleResultsOverride(this)" style="background:none;border:none;cursor:pointer;font-size:0.75rem;color:var(--ink-muted);display:flex;align-items:center;gap:6px;padding:0;">
                  <svg id="resultsToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="transition:transform 0.2s"><polyline points="9 18 15 12 9 6"/></svg>
                  Override ผลการทดสอบ (ไม่บันทึก)
                </button>
                <div id="resultsOverridePanel" style="display:none;margin-top:var(--space-3);overflow-x:auto;">
                  <table style="width:100%;border-collapse:collapse;font-size:0.78rem;" id="resultsOverrideTable">
                    <thead>
                      <tr style="background:var(--paper-warm);">
                        <th style="padding:6px 8px;text-align:left;border:1px solid var(--line);color:var(--ink-muted);font-weight:600;">#</th>
                        <th style="padding:6px 8px;text-align:left;border:1px solid var(--line);color:var(--ink-muted);font-weight:600;">Sampling Point</th>
                        <th style="padding:6px 8px;text-align:center;border:1px solid var(--line);color:var(--ink-muted);font-weight:600;">Result (CFU)</th>
                        <th style="padding:6px 8px;text-align:left;border:1px solid var(--line);color:var(--ink-muted);font-weight:600;">Remark</th>
                      </tr>
                    </thead>
                    <tbody id="resultsOverrideBody"></tbody>
                  </table>
                </div>
              </div>

            </div>
          </div>

          <!-- PDF Preview area -->
          <div class="pdf-viewer">
            <div class="pdf-viewer__header">
              <span class="pdf-viewer__title">ตัวอย่างข้อมูล</span>
              <span id="pdfViewerStatus"></span>
              <button onclick="openFullscreen()" id="btnFullscreen" style="margin-left:auto;padding:4px 10px;font-size:0.75rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:transparent;cursor:pointer;color:var(--ink-muted);" title="Full Screen">⛶ Full</button>
            </div>
            <div id="pdfViewerContent" class="pdf-viewer__content">
              <div class="pdf-viewer__placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                <p>เลือก Worksheet แล้วกด Preview Data</p>
              </div>
            </div>
          </div>

        </div><!-- /print-main -->
      </div><!-- /print-layout -->
    </main>
  </div>

  <div class="pdf-fullscreen-overlay" id="pdfFullscreenOverlay">
    <div class="pdf-fullscreen-bar">
      <span id="fullscreenTitle">PDF Preview</span>
      <button onclick="closeFullscreen()">✕ Close</button>
    </div>
    <iframe id="fullscreenIframe" src="about:blank" title="PDF Fullscreen"></iframe>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-spinner"></div>
    <div id="loadingText" class="loading-text">กำลังโหลด...</div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/print-utils.js"></script>
  <script src="../js/print-compressed-air.js"></script>

  <script>
    const OVERRIDE_SCALAR_FIELDS = [
      'tempRoom','incNo','lotMedia','mfgMedia',
      'expMedia','lotTSA','lotOther',
      'determinedDate','concludedDate','approvedDate'
    ];
    const DATE_FIELDS = new Set(['determinedDate','concludedDate','approvedDate']);

    function toggleOverridePanel() {
      document.getElementById('overridePanel').classList.toggle('override-panel--collapsed');
    }
    function toISODate(val) {
      if (!val) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
      const d = new Date(val);
      return isNaN(d) ? '' : d.toISOString().slice(0, 10);
    }

    function toggleResultsOverride(btn) {
      const panel = document.getElementById('resultsOverridePanel');
      const icon = document.getElementById('resultsToggleIcon');
      const open = panel.style.display === 'none';
      panel.style.display = open ? 'block' : 'none';
      icon.style.transform = open ? 'rotate(90deg)' : '';
    }

    function populateOverrideFields(data) {
      OVERRIDE_SCALAR_FIELDS.forEach(key => {
        const el = document.getElementById('ov_' + key);
        if (!el) return;
        el.value = DATE_FIELDS.has(key) ? toISODate(data[key]) : (data[key] || '');
      });

      // Populate results override table
      const samples = parseSamples ? parseSamples(data) : (data.samples || []);
      const tbody = document.getElementById('resultsOverrideBody');
      if (tbody && samples.length) {
        tbody.innerHTML = samples.map((s, i) => `
          <tr>
            <td style="padding:4px 8px;border:1px solid var(--line);color:var(--ink-muted);text-align:center;">${i+1}</td>
            <td style="padding:4px 8px;border:1px solid var(--line);color:var(--ink);">${s.samplingPoint || '-'}</td>
            <td style="padding:4px 8px;border:1px solid var(--line);text-align:center;">
              <input type="number" step="any" placeholder="${s.occResult ?? ''}" data-idx="${i}" data-field="result"
                style="width:80px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);text-align:center;font-size:0.78rem;">
            </td>
            <td style="padding:4px 8px;border:1px solid var(--line);">
              <input type="text" placeholder="${s.remark || ''}" data-idx="${i}" data-field="remark"
                style="width:100%;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-size:0.78rem;">
            </td>
          </tr>
        `).join('');
      }
    }

    function buildMergedData() {
      const merged = Object.assign({}, selectedData);
      OVERRIDE_SCALAR_FIELDS.forEach(key => {
        const el = document.getElementById('ov_' + key);
        if (!el) return;
        const v = el.value.trim();
        if (v !== '') merged[key] = v;
      });

      // Merge result overrides from table
      const tbody2 = document.getElementById('resultsOverrideBody');
      if (tbody2 && merged.samples) {
        tbody2.querySelectorAll('input[data-field="result"]').forEach(inp => {
          const idx = parseInt(inp.dataset.idx);
          if (inp.value !== '' && merged.samples[idx]) merged.samples[idx].occResult = inp.value;
        });
        tbody2.querySelectorAll('input[data-field="remark"]').forEach(inp => {
          const idx = parseInt(inp.dataset.idx);
          if (inp.value !== '' && merged.samples[idx]) merged.samples[idx].remark = inp.value;
        });
      }

      return merged;
    }

    function mapDataToTagsWithOverride(data) {
      return mapDataToTags(data);
    }

    async function previewPdfWithOverride() {
      if (!selectedData) { UI.showToast('กรุณาเลือก Worksheet ก่อน', 'warning'); return; }
      if (!await checkServerReady()) { UI.showToast('PDF Server ไม่พร้อม - กรุณารัน START-SERVER.bat', 'error'); return; }
      const merged = buildMergedData();
      const worksheetNo = merged.worksheetNo || merged.docNo;
      try {
        const files = await generatePdfFiles(
          { worksheetNo, templateName: TEMPLATE_NAME, formType: FOLDER_NAME },
          parseSamples(merged),
          function(ps) { return mapDataToTags(merged, ps); },
          SAMPLES_PER_PAGE
        );
        currentPreviewMode = 'pdf';
        currentPdfUrl = files[0].url;
        renderPdfViewer(files);
        UI.showToast('สร้าง PDF สำเร็จ (' + files.length + ' ชุด)', 'success');
      } catch (err) {
        UI.hideLoading();
        UI.showToast(err.message || 'เกิดข้อผิดพลาดในการสร้าง PDF', 'error');
      }
    }

    async function printPdfWithOverride() {
      if (!selectedData) { UI.showToast('กรุณาเลือก Worksheet ก่อน', 'warning'); return; }
      if (!await checkServerReady()) { UI.showToast('PDF Server ไม่พร้อม - กรุณารัน START-SERVER.bat', 'error'); return; }
      const merged = buildMergedData();
      const worksheetNo = merged.worksheetNo || merged.docNo;
      try {
        const files = await generatePdfFiles(
          { worksheetNo, templateName: TEMPLATE_NAME, formType: FOLDER_NAME },
          parseSamples(merged),
          function(ps) { return mapDataToTags(merged, ps); },
          SAMPLES_PER_PAGE
        );
        const file = files[0];
        if (!file) throw new Error('PDF generation returned no file');
        UI.showLoading('กำลังบันทึก PDF...');
        const r = await savePdfToDesktop(file.pdfId, FOLDER_NAME);
        if (!r.success) throw new Error(r.error || 'บันทึกไม่สำเร็จ: ' + worksheetNo);
        UI.hideLoading();
        UI.showToast('บันทึก PDF สำเร็จ: ' + worksheetNo, 'success');
      } catch (err) {
        UI.hideLoading();
        UI.showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
      }
    }

    function filterWorksheetList() {
      const q = document.getElementById('worksheetSearch').value.toLowerCase();
      document.querySelectorAll('.worksheet-item').forEach(el => {
        el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Override loadWorksheets to use AIR_SCRIPT_URL
      const _origLoad = window.loadWorksheets;
      if (_origLoad) {
        window.loadWorksheets = function() {
          if (typeof SYNC_CONFIG !== 'undefined' && SYNC_CONFIG.AIR_SCRIPT_URL) {
            return _origLoad.call(this, SYNC_CONFIG.AIR_SCRIPT_URL);
          }
          return _origLoad.apply(this, arguments);
        };
      }

      const _orig = window.selectWorksheet;
      window.selectWorksheet = function(index) {
        _orig(index);
        if (worksheets[index]) {
          populateOverrideFields(worksheets[index]);
          const ws = worksheets[index];
          const sub = [ws.building, typeof formatDateDMY === 'function' ? formatDateDMY(ws.samplingDate) : ws.samplingDate].filter(Boolean).join(' • ');
          document.getElementById('selectedSubInfo').textContent = sub;
        }
      };
    });
  </script>

  <script>
    function openFullscreen() {
      const src = currentPdfUrl;
      if (!src) { UI.showToast('กรุณา Preview PDF ก่อน', 'warning'); return; }
      document.getElementById('fullscreenIframe').src = src;
      document.getElementById('fullscreenTitle').textContent = document.getElementById('selectedInfo').textContent || 'PDF Preview';
      document.getElementById('pdfFullscreenOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeFullscreen() {
      document.getElementById('pdfFullscreenOverlay').classList.remove('active');
      document.getElementById('fullscreenIframe').src = 'about:blank';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFullscreen(); });
  </script>

  <button onclick="(function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);})()"
    title="Toggle theme"
    style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper-elevated);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px;">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</body>
