<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheet List - Compressed Air</title>
  <link rel="stylesheet" href="../css/style.css?v=5.0">
  <script>
    (function(){ var t=localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme',t); })();
    function toggleTheme(){ var c=document.documentElement.getAttribute('data-theme'); var n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('theme',n); var b=document.getElementById('themeToggle'); if(b) b.innerHTML=n==='dark'?'☀️':'🌙'; }
    function initThemeBtn(){ var t=localStorage.getItem('theme')||'light'; var b=document.getElementById('themeToggle'); if(b) b.innerHTML=t==='dark'?'☀️':'🌙'; }
    document.addEventListener('DOMContentLoaded', initThemeBtn);
  </script>
  <style>
    .list-page { display: flex; flex-direction: column; gap: var(--space-5); }

    /* Filter bar */
    .filter-bar {
      background: var(--paper-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5);
      display: flex; flex-wrap: wrap; gap: var(--space-3);
      box-shadow: var(--shadow-sm);
    }
    .filter-bar input, .filter-bar select {
      font-family: var(--font-body); font-size: 0.875rem;
      background: var(--paper-warm); color: var(--ink);
      border: 1px solid var(--line-strong); border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3); outline: none;
      transition: border-color var(--duration-fast);
    }
    .filter-bar input:focus, .filter-bar select:focus { border-color: var(--water); box-shadow: var(--shadow-glow); }
    #searchInput { flex: 1; min-width: 200px; }
    .filter-bar input[type="date"] { min-width: 140px; }
    #buildingSelect { min-width: 130px; }
    #statusFilter { min-width: 120px; }

    /* Stats row */
    .stats-row { display: flex; gap: var(--space-3); flex-wrap: wrap; }
    .stat-card {
      background: var(--paper-elevated); border: 1px solid var(--line);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-5);
      display: flex; align-items: center; gap: var(--space-2);
      box-shadow: var(--shadow-sm); min-width: 110px;
    }
    .stat-card__num { font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--ink); }
    .stat-card__label { font-size: 0.75rem; color: var(--ink-muted); margin-top: 2px; }
    .stat-card--synced .stat-card__num { color: var(--success); }
    .stat-card--pending .stat-card__num { color: var(--warning); }

    /* Table */
    .table-wrap {
      background: var(--paper-elevated); border: 1px solid var(--line);
      border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead { background: var(--paper-warm); }
    th {
      padding: var(--space-3) var(--space-4); text-align: left;
      font-weight: 600; font-size: 0.8rem; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      border-bottom: 1px solid var(--line);
    }
    td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.data-row { cursor: pointer; transition: background var(--duration-fast); }
    tbody tr.data-row:hover { background: var(--paper-warm); }
    tbody tr.expand-row td { padding: 0; }
    .expand-content {
      display: none; padding: var(--space-4) var(--space-6);
      background: var(--water-soft); border-top: 1px solid var(--line);
      font-size: 0.82rem; color: var(--ink-muted);
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-2) var(--space-5);
    }
    .expand-content.hidden { display: none; }
    .expand-field { display: flex; flex-direction: column; gap: 2px; }
    .expand-field span:first-child { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); }
    .expand-field span:last-child { color: var(--ink); font-weight: 500; }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: var(--radius-full);
      font-size: 0.75rem; font-weight: 600; white-space: nowrap;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge--synced { background: var(--success-soft); color: #15803d; }
    .badge--pending { background: var(--warning-soft); color: #b45309; }
    .badge--local { background: var(--line); color: var(--ink-muted); }

    /* Print btn */
    .btn-print {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: var(--radius-md);
      background: var(--water-soft); color: var(--water-deep);
      font-size: 0.8rem; font-weight: 600; border: 1px solid transparent;
      cursor: pointer; transition: background var(--duration-fast);
      white-space: nowrap;
    }
    .btn-print:hover { background: var(--water); color: #fff; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: var(--space-16) var(--space-8);
      color: var(--ink-muted);
    }
    .empty-state svg { opacity: 0.25; margin-bottom: var(--space-4); }
    .empty-state p { font-size: 1rem; }

    /* Row number */
    .row-num { color: var(--ink-muted); font-size: 0.8rem; font-family: var(--font-mono); }

    /* Dark mode */
    [data-theme="dark"] .filter-bar,
    [data-theme="dark"] .table-wrap,
    [data-theme="dark"] .stat-card {
      background: var(--ink-light); border-color: rgba(255,255,255,0.08);
    }
    [data-theme="dark"] .filter-bar input,
    [data-theme="dark"] .filter-bar select { background: var(--ink); border-color: rgba(255,255,255,0.12); color: var(--paper); }
    [data-theme="dark"] thead { background: rgba(255,255,255,0.04); }
    [data-theme="dark"] tbody tr.data-row:hover { background: rgba(255,255,255,0.04); }
    [data-theme="dark"] .expand-content { background: rgba(59,142,237,0.08); }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-header__logo">
          <div class="app-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
          </div>
          <div>
            <div class="app-header__title">Compressed Air</div>
            <div class="app-header__subtitle">Worksheet List</div>
          </div>
        </div>
        <nav class="app-header__nav">
          <a href="../index.html" class="nav-btn" title="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
          </a>
          <a href="form.html" class="nav-btn" title="New Worksheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span>New</span>
          </a>
          <div class="app-header__user">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span id="usernameDisplay">-</span>
          </div>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="list-page animate-slide-up">

        <!-- Filter bar -->
        <div class="filter-bar">
          <input type="text" id="searchInput" placeholder="Search worksheet no. or building...">
          <input type="date" id="dateFrom" title="Date from">
          <input type="date" id="dateTo" title="Date to">
          <select id="buildingSelect">
            <option value="">All Buildings</option>
            <option value="10">Bldg 10</option>
            <option value="12">Bldg 12</option>
            <option value="16">Bldg 16</option>
            <option value="19">Bldg 19</option>
          </select>
          <select id="statusFilter" style="min-width:130px;">
            <option value="Routine">Routine</option>
          </select>
        </div>

        <!-- Stats row -->
        <div class="stats-row">
          <div class="stat-card">
            <div><div class="stat-card__num" id="statTotal">0</div><div class="stat-card__label">Total</div></div>
          </div>
          <div class="stat-card stat-card--synced">
            <div><div class="stat-card__num" id="statSynced">0</div><div class="stat-card__label">Synced</div></div>
          </div>
          <div class="stat-card stat-card--pending">
            <div><div class="stat-card__num" id="statPending">0</div><div class="stat-card__label">Pending</div></div>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
          <table id="worksheetTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Worksheet No</th>
                <th>Doc No</th>
                <th>Sampling Date</th>
                <th>Building</th>
                <th>Status</th>
                <th>Created By</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display:none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <p>No worksheets found</p>
          </div>
        </div>

      </div>
    </main>

    <footer class="app-footer">
      Water Record System v1.0 • ANF3 Laboratory
    </footer>
  </div>

<button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Dark / Light mode">🌙</button>

  <script src="../js/utils.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/db.js"></script>
  <script>
    let allRecords = [];

    const SHEET_NAMES_CA = { 'Routine': 'records_ca' };

    async function loadFromGoogleSheet(status) {
      const sheetName = SHEET_NAMES_CA[status] || 'records_ca';
      const url = `${SYNC_CONFIG.AIR_SCRIPT_URL}?action=getRecords&sheetName=${encodeURIComponent(sheetName)}`;
      const resp = await fetch(url);
      const result = await resp.json();
      if (result.success && result.data) return result.data;
      return [];
    }

    function statusInfo(syncStatus) {
      if (syncStatus === 'synced') return { label: 'Synced', cls: 'badge--synced' };
      if (syncStatus === 'pending') return { label: 'Pending', cls: 'badge--pending' };
      return { label: 'Local', cls: 'badge--local' };
    }

    function val(v) { return v || '-'; }

    function renderTable(records) {
      const tbody = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');

      const synced = records.filter(r => r.syncStatus === 'synced').length;
      const pending = records.filter(r => r.syncStatus === 'pending').length;
      document.getElementById('statTotal').textContent = records.length;
      document.getElementById('statSynced').textContent = synced;
      document.getElementById('statPending').textContent = pending;

      if (!records.length) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      const sorted = [...records].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

      tbody.innerHTML = sorted.map((r, i) => {
        const { label, cls } = statusInfo(r.syncStatus);
        const expandId = 'exp-' + i;
        return `
          <tr class="data-row" onclick="toggleExpand('${expandId}')">
            <td class="row-num">${i + 1}</td>
            <td style="font-family:var(--font-mono);font-weight:600">${val(r.worksheetNo)}</td>
            <td style="color:var(--ink-muted)">${val(r.docNo)}</td>
            <td>${r.samplingDate ? DateUtils.formatDMY(r.samplingDate) : '-'}</td>
            <td>${val(r.building)}</td>
            <td><span class="badge ${cls}">${label}</span></td>
            <td style="color:var(--ink-muted)">${val(r.createdBy)}</td>
            <td>
              <button class="btn-print" onclick="event.stopPropagation();printRecord('${r.worksheetNo}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 6 2 18 2 18 9"/>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                  <rect x="6" y="14" width="12" height="8"/>
                </svg>
                Print
              </button>
            </td>
          </tr>
          <tr class="expand-row">
            <td colspan="8">
              <div id="${expandId}" class="expand-content hidden">
                <div class="expand-field"><span>Sampling Date</span><span>${r.samplingDate ? DateUtils.formatDMY(r.samplingDate) : '-'}</span></div>
                <div class="expand-field"><span>Performed Date</span><span>${r.performedDate ? DateUtils.formatDMY(r.performedDate) : '-'}</span></div>
                <div class="expand-field"><span>Determined Date</span><span>${r.determinedDate ? DateUtils.formatDMY(r.determinedDate) : '-'}</span></div>
                <div class="expand-field"><span>Temp Room</span><span>${val(r.tempRoom)}</span></div>
                <div class="expand-field"><span>Inc No</span><span>${val(r.incNo)}</span></div>
                ${r.lotMedia ? `<div class="expand-field"><span>Lot Media</span><span>${r.lotMedia}</span></div>` : ''}
                ${r.sampleCount != null ? `<div class="expand-field"><span>Sample Count</span><span>${r.sampleCount}</span></div>` : ''}
                <div class="expand-field"><span>Record Status</span><span>${val(r.recordStatus)}</span></div>
                <div class="expand-field"><span>Created At</span><span>${val(r.createdAt)}</span></div>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    function toggleExpand(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    function printRecord(worksheetNo) {
      window.location.href = 'print.html?worksheetNo=' + encodeURIComponent(worksheetNo);
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const dateFrom = document.getElementById('dateFrom').value;
      const dateTo = document.getElementById('dateTo').value;
      const building = document.getElementById('buildingSelect').value;

      const filtered = allRecords.filter(r => {
        if (search) {
          const wsNo = (r.worksheetNo || '').toLowerCase();
          const bldg = (r.building || '').toLowerCase();
          if (!wsNo.includes(search) && !bldg.includes(search)) return false;
        }
        if (dateFrom && r.samplingDate && r.samplingDate < dateFrom) return false;
        if (dateTo && r.samplingDate && r.samplingDate > dateTo) return false;
        if (building && r.building !== building) return false;
        return true;
      });

      renderTable(filtered);
    }

    async function reloadSheet() {
      const status = document.getElementById('statusFilter').value;
      try {
        UI.showLoading('Loading worksheets...');
        allRecords = await loadFromGoogleSheet(status);
        applyFilters();
      } catch (e) {
        UI.showToast('Failed to load records: ' + e.message, 'error');
        renderTable([]);
      } finally {
        UI.hideLoading();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const username = Storage.get('username');
      if (!username) { window.location.href = '../index.html'; return; }
      document.getElementById('usernameDisplay').textContent = username;

      ['searchInput', 'dateFrom', 'dateTo', 'buildingSelect'].forEach(id => {
        document.getElementById(id).addEventListener('input', applyFilters);
      });
      document.getElementById('statusFilter').addEventListener('change', reloadSheet);

      await reloadSheet();
    });
  </script>
</body>
</html>
