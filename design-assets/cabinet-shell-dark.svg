<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ANF3 dark digital record cabinet</title>
  <desc id="desc">An empty three-shelf laboratory record cabinet with restrained dark materials and space for interactive binders.</desc>
  <defs>
