    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17201F"/><stop offset="0.18" stop-color="#26312F"/><stop offset="1" stop-color="#1B2523"/></linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#485653"/><stop offset="0.38" stop-color="#313D3B"/><stop offset="1" stop-color="#17201F"/></linearGradient>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050807" flood-opacity="0.52"/></filter>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.38"/></filter>
