<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sampling Points Reference</title>
  <link rel="stylesheet" href="css/style.css?v=4.2">
  <style>
    /* Master Data Page Specific Styles */
    .master-data-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-6);
    }
    
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }
    
    .page-header__title {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    
    .page-header__icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--water) 0%, var(--water-deep) 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .page-header__icon svg {
      width: 24px;
      height: 24px;
    }
    
    .page-header__text h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--ink);
      margin: 0;
    }
    
    .page-header__text p {
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin: 0;
    }
    
    /* Filter Controls */
    .filter-bar {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-5);
      padding: var(--space-4);
      background: var(--paper-warm);
      border-radius: var(--radius-lg);
      align-items: center;
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    
    .filter-group label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .filter-group select,
    .filter-group input {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      background: var(--paper-elevated);
      min-width: 150px;
    }
    
    .filter-group input[type="search"] {
      min-width: 250px;
    }
    
    .filter-stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    
    .stats-badge {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--water-soft);
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--water-deep);
    }
    
    .stats-badge svg {
      width: 14px;
      height: 14px;
    }
    
    /* Data Table */
    .data-table-wrapper {
      background: var(--paper-elevated);
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    
    .data-table thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .data-table th {
      background: linear-gradient(135deg, var(--ink) 0%, var(--ink-light) 100%);
      color: white;
      padding: var(--space-3) var(--space-4);
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      border-bottom: 2px solid var(--water);
    }
    
    .data-table th:first-child {
      border-top-left-radius: var(--radius-lg);
    }
    
    .data-table th:last-child {
      border-top-right-radius: var(--radius-lg);
    }
    
    .data-table tbody tr {
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .data-table tbody tr:hover {
      background: var(--water-soft);
    }
    
    .data-table tbody tr:nth-child(even) {
      background: var(--paper-warm);
    }
    
    .data-table tbody tr:nth-child(even):hover {
      background: var(--water-soft);
    }
    
    .data-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    
    .data-table .col-no {
      width: 50px;
      text-align: center;
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }
    
    .data-table .col-point {
      font-weight: 600;
      color: var(--water-deep);
    }
    
    .data-table .col-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--ink-light);
    }
    
    .data-table .col-location {
      max-width: 300px;
    }
    
    /* Building Badge */
    .building-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .building-badge--10 {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .building-badge--12 {
      background: #dcfce7;
      color: #166534;
    }
    
    .building-badge--16 {
      background: #fef3c7;
      color: #92400e;
    }
    
    .building-badge--19 {
      background: #f3e8ff;
      color: #6b21a8;
    }
    
    /* Water Type Badge */
    .water-badge {
      display: inline-block;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      font-weight: 600;
    }
    
    .water-badge--PW {
      background: var(--water-soft);
      color: var(--water-deep);
    }
    
    .water-badge--PRW {
      background: #dcfce7;
      color: #166534;
    }
    
    .water-badge--WFI {
      background: #fef3c7;
      color: #92400e;
    }
    
    /* Loading State */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12);
      color: var(--ink-muted);
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--water);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--space-4);
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12);
      color: var(--ink-muted);
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: var(--space-4);
      opacity: 0.3;
    }
    
    /* Table Scroll Container */
    .table-scroll {
      max-height: calc(100vh - 320px);
      overflow-y: auto;
    }
    
    .table-scroll::-webkit-scrollbar {
      width: 8px;
    }
    
    .table-scroll::-webkit-scrollbar-track {
      background: var(--paper-warm);
    }
    
    .table-scroll::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: var(--radius-full);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .master-data-container {
        padding: var(--space-4);
      }
      
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-group select,
      .filter-group input {
        width: 100%;
        min-width: unset;
      }
      
      .filter-stats {
        margin-left: 0;
        justify-content: center;
      }
      
      .data-table {
        font-size: 0.75rem;
      }
      
      .data-table th,
      .data-table td {
        padding: var(--space-2);
      }
    }
    
    /* Highlight matching text */
    .highlight {
      background: #fef08a;
      padding: 0 2px;
      border-radius: 2px;
    }

    /* Type Tabs */
    .type-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
    }

    .type-tab {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border: 2px solid var(--line);
      background: var(--paper-elevated);
      color: var(--ink-muted);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .type-tab:hover {
      border-color: var(--ink-light);
      color: var(--ink);
    }

    .type-tab.active {
      border-color: var(--water);
      background: var(--water-soft);
      color: var(--water-deep);
    }

    .type-tab.active[data-type="air"] {
      border-color: #8b5cf6;
      background: #f3e8ff;
      color: #6b21a8;
    }

    .type-tab svg {
      width: 16px;
      height: 16px;
    }

    /* Sub-tabs for Air (CA / EM) */
    .sub-tabs {
      display: none;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .sub-tabs.visible {
      display: flex;
    }

    .sub-tab {
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--paper-elevated);
      color: var(--ink-muted);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .sub-tab:hover {
      background: #f3e8ff;
    }

    .sub-tab.active {
      background: #8b5cf6;
      color: white;
      border-color: #8b5cf6;
    }

    /* Grade Badge */
    .grade-badge {
      display: inline-block;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .grade-badge--A {
      background: #dcfce7;
      color: #166534;
    }

    .grade-badge--B {
      background: #dbeafe;
      color: #1e40af;
    }

    .grade-badge--C {
      background: #fef3c7;
      color: #92400e;
    }

    .grade-badge--D {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
  <link rel="stylesheet" href="css/anf3-v7.css">
</head>
<body data-workflow="home">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-header__logo">
          <div class="app-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
          </div>
          <div>
            <div class="app-header__title">Sampling Points</div>
            <div class="app-header__subtitle">Reference Database</div>
          </div>
        </div>
        
        <nav class="app-header__nav">

        <!-- Sub-tabs for Air -->
        <div class="sub-tabs" id="airSubTabs">

    <!-- Footer -->

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script>
    // ============================================
    // Master Data Page Logic — Water + Air
    // ============================================
    
    let allData = [];
    let filteredData = [];
    
    // Determine page type from URL param
    const urlParams = new URLSearchParams(window.location.search);
    const pageType = urlParams.get('type') === 'air' ? 'air' : 'water';
    let airSheet = 'database_ca'; // default sub-tab for air
    
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      console.log(`📊 Initializing Master Data page (${pageType})...`);
      
      setupPageUI();
      Network.updateStatus();
      await loadMasterData();
    });
    
    // Setup page UI based on type
    function setupPageUI() {
      // Activate correct tab
      document.getElementById(pageType === 'air' ? 'tabAir' : 'tabWater').classList.add('active');
      
      // Show/hide air sub-tabs
      const subTabs = document.getElementById('airSubTabs');
      if (pageType === 'air') {
        subTabs.classList.add('visible');
      }
      
      // Update page header icon gradient for air
      if (pageType === 'air') {
        document.getElementById('pageIcon').style.background = 'linear-gradient(135deg, #8b5cf6 0%, #6b21a8 100%)';
        document.getElementById('pageTitle').textContent = 'Air Sampling Points Database';
        document.getElementById('pageSubtitle').textContent = 'ข้อมูลจุดเก็บตัวอย่างอากาศจาก Google Sheet';
        document.title = 'Sampling Points Reference - Air Record';
      } else {
        document.getElementById('pageTitle').textContent = 'Water Sampling Points Database';
        document.getElementById('pageSubtitle').textContent = 'ข้อมูลจุดเก็บตัวอย่างน้ำทั้งหมดจาก Google Sheet';
        document.title = 'Sampling Points Reference - Water Record';
      }
      
      // Build filters
      buildFilters();
      // Build table headers
      buildTableHeaders();
    }
    
    // Build filter bar based on type
    function buildFilters() {
      const filterBar = document.getElementById('filterBar');
      
      if (pageType === 'water') {
        filterBar.innerHTML = `
          <div class="filter-group">
            <label>Building</label>
            <select id="filterBuilding" onchange="applyFilters()">
              <option value="">ทั้งหมด</option>
              <option value="Building 10">Building 10</option>
              <option value="Building 12">Building 12</option>
              <option value="Building 16">Building 16</option>
              <option value="Building 19">Building 19</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Water Type</label>
            <select id="filterWaterType" onchange="applyFilters()">
              <option value="">ทั้งหมด</option>
              <option value="PW">PW</option>
              <option value="PRW">PRW</option>
              <option value="WFI">WFI</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Water System</label>
            <select id="filterWaterSystem" onchange="applyFilters()">
              <option value="">ทั้งหมด</option>
              <option value="GENERATION SYSTEM">Generation System</option>
              <option value="DISTRIBUTION SYSTEM">Distribution System</option>
            </select>
          </div>
          <div class="filter-group">
            <label>ค้นหา</label>
            <input type="search" id="searchInput" placeholder="ค้นหา Point, Tag, Location..." oninput="applyFilters()">
          </div>
          <div class="filter-stats">
            <div class="stats-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
              <span id="statsCount">0 รายการ</span>
            </div>
          </div>
        `;
      } else {
        // Air filters
        filterBar.innerHTML = `
          <div class="filter-group">
            <label>Building</label>
            <select id="filterBuilding" onchange="applyFilters()">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Grade</label>
            <select id="filterGrade" onchange="applyFilters()">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
          <div class="filter-group">
            <label>ค้นหา</label>
            <input type="search" id="searchInput" placeholder="ค้นหา Point, Room No., Grade..." oninput="applyFilters()">
          </div>
          <div class="filter-stats">
            <div class="stats-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
              <span id="statsCount">0 รายการ</span>
            </div>
          </div>
        `;
      }
    }
    
    // Build table headers
    function buildTableHeaders() {
      const thead = document.getElementById('dataTableHead');
      
      if (pageType === 'water') {
        thead.innerHTML = `
          <tr>
            <th class="col-no">#</th>
            <th>Sampling Point</th>
            <th>Sampling Tag</th>
            <th>Location</th>
            <th>Building</th>
            <th>Water Type</th>
            <th>Water System</th>
          </tr>
        `;
      } else {
        // Air: dynamic columns from actual database fields
        buildAirTableHeaders();
      }
    }
    
    // Air: detect columns from loaded data and build table headers dynamically
    let airColumns = [];
    
    function buildAirTableHeaders() {
      const thead = document.getElementById('dataTableHead');
      if (!allData || allData.length === 0) {
        airColumns = [];
        thead.innerHTML = '<tr><th class="col-no">#</th><th>No data</th></tr>';
        return;
      }
      // Gather all unique keys from the data (preserving first-seen order)
      const keySet = new Set();
      allData.forEach(item => Object.keys(item).forEach(k => keySet.add(k)));
      airColumns = [...keySet];
      
      // Column display name map
      const labelMap = {
        samplingLabel: 'Sampling Label', samplingPoint: 'Sampling Point',
        noLocation: 'Room No.', location: 'Location', building: 'Building',
        grade: 'Grade', airType: 'Air Type', floor: 'Floor',
        samplingTag: 'Sampling Tag'
      };
      
      const ths = airColumns.map(k => `<th>${labelMap[k] || k}</th>`).join('');
      thead.innerHTML = `<tr><th class="col-no">#</th>${ths}</tr>`;
    }
    
    // Get Air Script URL
    function getAirScriptURL() {
      return localStorage.getItem('air_script_url') || SYNC_CONFIG.AIR_SCRIPT_URL || '';
    }
    
    // Load Master Data
    async function loadMasterData() {
      const tbody = document.getElementById('dataTableBody');
      const colSpan = pageType === 'water' ? 7 : Math.max((airColumns.length || 6) + 1, 4);
      
      try {
        tbody.innerHTML = `
          <tr>
            <td colspan="${colSpan}">
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <span>กำลังโหลดข้อมูลจาก Google Sheet...</span>
              </div>
            </td>
          </tr>
        `;
        
        if (pageType === 'water') {
          await loadWaterData();
        } else {
          await loadAirData();
          buildAirTableHeaders();
        }
        
        filteredData = [...allData];
        populateDynamicFilters();
        renderTable();
        updateStats();
        
      } catch (error) {
        console.error('Error loading master data:', error);
        tbody.innerHTML = `
          <tr>
            <td colspan="${colSpan}">
              <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="8" x2="12" y2="12"/>
                  <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>ไม่สามารถโหลดข้อมูลได้</span>
              </div>
            </td>
          </tr>
        `;
      }
    }
    
    // Load Water data
    async function loadWaterData() {
      if (Network.isOnline() && SYNC_CONFIG.SCRIPT_URL) {
        try {
          const url = `${SYNC_CONFIG.SCRIPT_URL}?action=getMasterData`;
          const response = await fetch(url);
          const result = await response.json();
          if (result.success && result.data) {
            allData = result.data;
            console.log(`✅ Loaded ${allData.length} water items from Google Sheet`);
            return;
          }
          throw new Error(result.error || 'Failed to fetch');
        } catch (e) {
          console.warn('⚠️ Could not fetch from Sheet, using local data:', e);
        }
      }
      // Fallback to local
      try {
        const response = await fetch('data/water-data.json');
        allData = await response.json();
        console.log(`📁 Loaded ${allData.length} items from local file`);
      } catch (e) {
        console.error('Could not load local data:', e);
        allData = [];
      }
    }
    
    // Load Air data
    async function loadAirData() {
      const airURL = getAirScriptURL();
      if (!airURL) {
        console.error('❌ Air Script URL not configured');
        allData = [];
        return;
      }
      
      try {
        const url = `${airURL}?action=getMasterData&sheetName=${airSheet}`;
        const response = await fetch(url);
        const result = await response.json();
        if (result.success && result.data) {
          allData = result.data;
          console.log(`✅ Loaded ${allData.length} air items (${airSheet}) from Google Sheet`);
        } else {
          throw new Error(result.error || 'Failed to fetch air data');
        }
      } catch (e) {
        console.error('❌ Could not fetch air data:', e);
        allData = [];
      }
    }
    
    // Populate dynamic filter dropdowns (for Air)
    function populateDynamicFilters() {
      if (pageType !== 'air') return;
      
      // Buildings
      const buildings = [...new Set(allData.map(d => d.building).filter(Boolean))].sort();
      const buildingSelect = document.getElementById('filterBuilding');
      if (buildingSelect) {
        buildingSelect.innerHTML = '<option value="">ทั้งหมด</option>' + 
          buildings.map(b => `<option value="${b}">${b}</option>`).join('');
      }
      
      // Grades
      const grades = [...new Set(allData.map(d => d.grade).filter(Boolean))].sort();
      const gradeSelect = document.getElementById('filterGrade');
      if (gradeSelect) {
        gradeSelect.innerHTML = '<option value="">ทั้งหมด</option>' + 
          grades.map(g => `<option value="${g}">${g}</option>`).join('');
      }
    }
    
    // Switch Air sub-tab
    function switchAirSheet(sheet) {
      airSheet = sheet;
      // Update active sub-tab
      document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.sub-tab[data-sheet="${sheet}"]`).classList.add('active');
      
      buildTableHeaders();
      buildFilters();
      loadMasterData();
    }
    
    // Refresh Data
    async function refreshData() {
      allData = [];
      filteredData = [];
      await loadMasterData();
    }
    
    // Apply Filters
    function applyFilters() {
      const building = document.getElementById('filterBuilding')?.value || '';
      const search = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      
      if (pageType === 'water') {
        const waterType = document.getElementById('filterWaterType')?.value || '';
        const waterSystem = document.getElementById('filterWaterSystem')?.value || '';
        
        filteredData = allData.filter(item => {
          if (building && item.building !== building) return false;
          if (waterType && item.waterType !== waterType) return false;
          if (waterSystem && item.waterSystem !== waterSystem) return false;
          if (search) {
            const text = [item.samplingPoint, item.samplingTag, item.location, item.noLocation].join(' ').toLowerCase();
            if (!text.includes(search)) return false;
          }
          return true;
        });
      } else {
        const grade = document.getElementById('filterGrade')?.value || '';
        
        filteredData = allData.filter(item => {
          if (building && item.building !== building) return false;
          if (grade && item.grade !== grade) return false;
          if (search) {
            const text = [
              item.samplingPoint, item.samplingLabel, item.noLocation,
              item.grade, item.floor, item.airType, item.building
            ].filter(Boolean).join(' ').toLowerCase();
            if (!text.includes(search)) return false;
          }
          return true;
        });
      }
      
      renderTable();
      updateStats();
    }
    
    // Render Table
    function renderTable() {
      const tbody = document.getElementById('dataTableBody');
      const search = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const colSpan = pageType === 'water' ? 7 : Math.max((airColumns.length || 6) + 1, 4);
      
      if (filteredData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${colSpan}">
              <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>ไม่พบข้อมูลที่ตรงกับเงื่อนไข</span>
              </div>
            </td>
          </tr>
        `;
        return;
      }
      
      const highlight = (text) => {
        if (!search || !text) return text || '-';
        const escaped = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escaped})`, 'gi');
        return String(text).replace(regex, '<span class="highlight">$1</span>');
      };
      
      if (pageType === 'water') {
        tbody.innerHTML = filteredData.map((item, i) => {
          const buildingNum = item.building ? item.building.replace('Building ', '') : '';
          return `
            <tr>
              <td class="col-no">${i + 1}</td>
              <td class="col-point">${highlight(item.samplingPoint)}</td>
              <td class="col-tag">${highlight(item.samplingTag)}</td>
              <td class="col-location">${highlight(item.location)}</td>
              <td><span class="building-badge building-badge--${buildingNum}">🏢 ${item.building || '-'}</span></td>
              <td><span class="water-badge water-badge--${item.waterType || 'PW'}">${item.waterType || '-'}</span></td>
              <td>${item.waterSystem || '-'}</td>
            </tr>
          `;
        }).join('');
      } else {
        // Air: dynamic columns
        tbody.innerHTML = filteredData.map((item, i) => {
          const cells = airColumns.map(k => {
            const val = item[k];
            if (k === 'grade') {
              const g = val || '-';
              return `<td><span class="grade-badge grade-badge--${g}">${g}</span></td>`;
            }
            return `<td>${highlight(val) || '-'}</td>`;
          }).join('');
          return `<tr><td class="col-no">${i + 1}</td>${cells}</tr>`;
        }).join('');
      }
    }
    
    // Update Stats
    function updateStats() {
      const el = document.getElementById('statsCount');
      if (el) el.textContent = `${filteredData.length} รายการ`;
    }
  </script>
</body>
</html>
