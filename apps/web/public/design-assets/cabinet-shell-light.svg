    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FBFCFC"/><stop offset="0.38" stop-color="#DDE5E4"/><stop offset="1" stop-color="#BFCBCA"/></linearGradient>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#20302F" flood-opacity="0.20"/></filter>
